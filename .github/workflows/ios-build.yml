name: iOS Unsigned Build

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL for a physical device (e.g. http://192.168.1.3:3000)'
        required: false
        default: ''

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Diagnostics - macOS
        run: sw_vers

      - name: Diagnostics - Xcode
        run: xcodebuild -version

      - name: Diagnostics - iOS SDKs
        run: xcodebuild -showsdks

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Diagnostics - Flutter version
        run: flutter --version

      - name: Diagnostics - Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build ios --release --no-codesign
          fi

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r TokiGo-unsigned.ipa Payload
          ls -lh TokiGo-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokiGo-iOS-unsigned
          path: TokiGo-unsigned.ipa
          retention-days: 14
