name: iOS Unsigned Build

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL for a physical device (e.g. http://192.168.1.3:3000)'
        required: false
        default: ''
      google_server_client_id:
        description: 'Google OAuth web/server client ID (Android-compatible)'
        required: false
        default: '423433597936-erj0nejep60cs5g84s4goknhis6v8jle.apps.googleusercontent.com'
      google_ios_client_id:
        description: 'Google OAuth iOS client ID'
        required: false
        default: '423433597936-uqb2274m2jk3eno1n41es30ssv44uau4.apps.googleusercontent.com'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Diagnostics - macOS
        run: sw_vers

      - name: Diagnostics - Xcode
        run: xcodebuild -version

      - name: Diagnostics - iOS SDKs
        run: xcodebuild -showsdks

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Diagnostics - Flutter version
        run: flutter --version

      - name: Diagnostics - Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          set -euo pipefail
          ARGS=(build ios --release --no-codesign)
          if [ -n "${API_BASE_URL}" ]; then
            ARGS+=(--dart-define=API_BASE_URL="${API_BASE_URL}")
            if [[ "${API_BASE_URL}" =~ ^http://10\.[0-9]+\.[0-9]+\.[0-9]+(:[0-9]+)?(/.*)?$ ]] || [[ "${API_BASE_URL}" =~ ^http://172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]+\.[0-9]+(:[0-9]+)?(/.*)?$ ]] || [[ "${API_BASE_URL}" =~ ^http://192\.168\.[0-9]+\.[0-9]+(:[0-9]+)?(/.*)?$ ]]; then
              ARGS+=(--dart-define=ALLOW_INSECURE_LOCAL_API=true)
            fi
          fi
          ARGS+=(--dart-define=GOOGLE_SERVER_CLIENT_ID="${{ github.event.inputs.google_server_client_id }}")
          ARGS+=(--dart-define=GOOGLE_IOS_CLIENT_ID="${{ github.event.inputs.google_ios_client_id }}")
          flutter "${ARGS[@]}" 

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r TokiGo-unsigned.ipa Payload
          ls -lh TokiGo-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokiGo-iOS-unsigned
          path: TokiGo-unsigned.ipa
          retention-days: 14
