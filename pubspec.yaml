name: tokigo
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Material/Widgets localizations (en/ar + RTL mirroring)
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Riverpod: required central, scalable state-management foundation.
  flutter_riverpod: ^2.6.1

  go_router: ^14.8.0

  # Platform secure storage for iOS Keychain / Android Keystore / Linux libsecret
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  crypto: ^3.0.3
  equatable: ^2.0.5
  geolocator: ^13.0.2
  speech_to_text: ^7.4.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  permission_handler: ^13.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dependency_overrides:
  flutter_secure_storage_linux: 1.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  # iOS masks the icon itself: the master must be a full-bleed opaque square.
  remove_alpha_ios: true
  # Owner decision (2026-11, updated 2026-11-27): the OUTSIDE icon is the
  # TokiGo wordmark — the Home header's letterforms in one colour. The dark
  # master (black field, white TokiGo, no red) is FIXED for BOTH appearances.
  # The identity assets assets/icon/app_icon_* now hold the compact white
  # wordmark used by AI and the Android 12 splash. Owner follow-up keeps the
  # parasol only on the Packages quick tile via packages_parasol* files.
  image_path: assets/icon/launcher_wordmark_dark_1024.png
  # iOS 18 dark appearance: transparent master, iOS supplies the dark field.
  image_path_ios_dark_transparent: assets/icon/launcher_wordmark_ios_dark_1024.png
  adaptive_icon_background: "#000000"
  # The wordmark is already drawn inside the 66% safe zone, so the default 16%
  # inset would shrink it twice.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_foreground: assets/icon/launcher_wordmark_adaptive_dark_foreground_1024.png
  adaptive_icon_monochrome: assets/icon/launcher_wordmark_adaptive_monochrome_1024.png

# The splash shows the white TokiGo wordmark only: no parasol and no old red
# "Go" in the launch artwork (owner decision 2026-11-27). The parasol exception
# is confined to the Packages quick tile and is not referenced here. The composed masters are rendered by
# tool/branding/generate_splash.py from the white wordmark masters. Regenerate
# them there, then run `dart run flutter_native_splash:create` followed by
# `python scripts/normalize_ios_launch_screen.py` (the generator rewrites the
# iOS storyboard background and emits trailing spaces in web/index.html).
#
# Owner decision (2026-11): the DARK splash (#111111 field, white artwork) is
# the FIXED splash — it is generated for BOTH appearances, so the launch screen
# never changes with the system mode.
flutter_native_splash:
  color: "#111111"
  image: assets/branding/logo_splash_dark.png
  color_dark: "#111111"
  image_dark: assets/branding/logo_splash_dark.png
  android_gravity: center
  # The composed wordmark image carries the dark field; fit it instead of
  # centring its intrinsic bitmap, which cropped it on tall iPhones.
  ios_content_mode: scaleAspectFit
  fullscreen: true
  android_12:
    # Android 12+ masks the outer third of the icon. One compact white
    # wordmark in the icon slot is the whole splash: no second branding
    # raster underneath it, which used to read as a duplicated old splash.
    color: "#111111"
    image: assets/icon/app_icon_adaptive_dark_foreground_1024.png
    color_dark: "#111111"
    image_dark: assets/icon/app_icon_adaptive_dark_foreground_1024.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # App image assets (placeholders + future real imagery)
  assets:
    - assets/images/
    # Explore city photography. One bundled photo per catalog city, resolved
    # through the city id by the explore image registry — never a remote URL,
    # so a city card renders on a first offline launch with no download.
    - assets/explore/cities/
    - assets/explore/manifest.json
    # The compact white TokiGo wordmark is the AI assistant identity; the
    # adaptive master also feeds the Android 12 splash. No parasol here.
    - assets/icon/app_icon_adaptive_foreground_1024.png
    - assets/icon/app_icon_adaptive_dark_foreground_1024.png
    # Owner follow-up (2026-11-27): the parasol is restored ONLY on the Home /
    # Onboarding Packages quick action. These dedicated files keep it out of
    # the splash, launcher and AI surfaces.
    - assets/icon/packages_parasol_1024.png
    - assets/icon/packages_parasol_dark_1024.png

  # Premium type system: Manrope (Latin) + Cairo (Arabic), variable fonts.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package