# Edge cache for the TokiGo image resizer.
#
# This is the self-hosted stand-in for a CDN. nginx keeps the encoded WebP on
# local disk and answers repeats without touching Nest, which turns the
# per-instance `backend/.cache/images` into a shared, restart-proof tier.
#
# Layout:
#   * the `proxy_cache_path` line goes in the http{} block (nginx.conf);
#   * the `server{}` block goes in conf.d/.
#
# Then point the app at this host:
#   flutter build apk --dart-define=IMAGE_BASE_URL=https://cdn.example.com
#
# The origin already sends `Cache-Control: public, max-age=604800, immutable`
# plus `CDN-Cache-Control` / `Surrogate-Control`, and every URL encodes
# `src`, `w` and `f` — so a cached entry can never be wrong for a different
# request. That is what makes a week-long TTL safe.

# http{} context
proxy_cache_path /var/cache/nginx/tokigo-images
                 levels=1:2
                 keys_zone=tokigo_images:64m
                 max_size=10g
                 inactive=7d
                 use_temp_path=off;

# server{} context
server {
    listen 443 ssl http2;
    server_name cdn.example.com;

    # Long-lived edge cache. `lock` collapses concurrent misses for the same
    # photo into ONE origin fetch; `use_stale` keeps serving a photo while the
    # origin revalidates or is briefly down.
    location /images/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache tokigo_images;
        # The full URI is the cache key: `src` is already URL-encoded.
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 301 302 1h;
        proxy_cache_valid 400 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Set-Cookie;

        # Visible in `curl -I` so a cache problem is never a guess.
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Everything else is the API and must not be cached here.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
